name: Frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: |
          node scripts/test_omoide_album.cjs
          node scripts/test_person_view_cache.cjs
          node scripts/test_first_seen_gallery.cjs
          node scripts/test_film_restoration.cjs
          node scripts/test_review_controls.cjs
